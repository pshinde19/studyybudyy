<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Response Streamer</title>
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
    --primary-color: #2563eb;
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-color: #1e293b;
    --border-color: #e2e8f0;
}

body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    line-height: 1.6;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

#chat-window {
    width: 100%;
    max-width: 800px;
    background: var(--card-bg);
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    min-height: 500px;
}

/* Markdown Typography */
h1, h2, h3 { color: var(--primary-color); margin-top: 1.5em; }

/* Tables */
table {
    border-collapse: collapse;
    width: 100%;
    margin: 24px 0;
    font-size: 0.95em;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border-color);
}

th {
    background-color: #f1f5f9;
    color: var(--text-color);
    text-align: left;
    padding: 12px 15px;
    font-weight: 600;
}

td {
    padding: 12px 15px;
    border-bottom: 1px solid var(--border-color);
}

/* Code Blocks & Charts */
pre {
    background: #1e293b;
    color: #f8fafc;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
}

.chart-wrapper {
    background: white;
    padding: 24px;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    margin: 24px 0;
}

/* Cursor & Status */
.cursor {
    display: inline-block;
    width: 3px;
    height: 1.2em;
    background: var(--primary-color);
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

.status-badge {
    display: inline-block;
    padding: 6px 14px;
    background: #dcfce7;
    color: #166534;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 24px;
}
    </style>
</head>
<body>

    <div id="chat-window">
        <div id="status" class="status-badge">AI is thinking...</div>
        <div id="content"></div>
        <span id="cursor" class="cursor"></span>
    </div>

    <!-- Load custom logic -->
    <script >
    /**
     * AI Response Streamer Logic
     */

    const contentDiv = document.getElementById('content');
    const statusBadge = document.getElementById('status');
    const cursor = document.getElementById('cursor');

    let accumulatedMarkdown = "";
    let renderedChartIds = new Set();

    // FULL MOCK DATA: Comprehensive response including all types
    const streamChunks = [
        '### **RAG Planning Protocol**\nTo answer **What is the significance of keys in React?**, follow these steps:\n1. **Analyze & Query**: Identify key concepts.\n2. **Retrieve**: Perform semantic search.\n3. **Augment & Generate**: Combine context and synthesize answer.',
        "\n # Project Alpha Status Report\n\n",
        "Current analysis shows a **positive trend** in user acquisition. ",
        "The growth is attributed to the recent UI overhaul.\n\n",
        "### Performance Overview\n",
        "| Metric | Result | Target |\n| :--- | :--- | :--- |\n",
        "| Page Load | 1.2s | < 2.0s |\n",
        "| Error Rate | 0.04% | < 0.1% |\n",
        "| Conversion | 4.2% | 3.5% |\n\n",
        "The following chart displays the monthly revenue distribution:\n\n",
        "### Next Steps:\n",
    "1. **Deploy** v2.1 to production.\n",
    "2. Monitor **API latency** spikes.\n",
    "3. Begin user interviews for Q3 features."
];

function processStream() {
    let chunkIndex = 0;

    const interval = setInterval(() => {
        if (chunkIndex < streamChunks.length) {
            const chunk = streamChunks[chunkIndex];
            accumulatedMarkdown += chunk;
            
            // Render HTML using marked.js
            if (typeof marked !== 'undefined') {
                contentDiv.innerHTML = marked.parse(accumulatedMarkdown);
            }
            
            // Check for completed charts
            handleCharts();
            
            chunkIndex++;
        } else {
            finalizeUI();
            clearInterval(interval);
        }
    }, 500);
}

function handleCharts() {
    const codeBlocks = document.querySelectorAll('pre code');
    
    codeBlocks.forEach((block, index) => {
        const text = block.innerText.trim();
        
        // Only render if it's a complete JSON object and hasn't been rendered
        if (text.startsWith('{') && text.endsWith('}') && !renderedChartIds.has(index)) {
            try {
                const config = JSON.parse(text);
                
                const wrapper = document.createElement('div');
                wrapper.className = 'chart-wrapper';
                const canvas = document.createElement('canvas');
                wrapper.appendChild(canvas);
                
                block.parentElement.replaceWith(wrapper);
                
                if (typeof Chart !== 'undefined') {
                    new Chart(canvas, config);
                }
                
                renderedChartIds.add(index);
            } catch (e) {
                // Ignore incomplete JSON chunks
            }
        }
    });
}

function finalizeUI() {
    if (statusBadge) {
        statusBadge.innerText = "Response Ready";
        statusBadge.style.background = "#f1f5f9";
        statusBadge.style.color = "#475569";
    }
    if (cursor) cursor.style.display = "none";
}

// Start simulation
window.onload = processStream;
    </script>
</body>
</html>
